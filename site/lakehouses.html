<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose a Fabric item</title><style>:root{--ink:#172033;--muted:#60708a;--line:#dce4ef;--canvas:#f5f7fb;--violet:#5b3cc4;--teal:#087b72}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Segoe UI",Aptos,Arial,sans-serif}.wrap{width:min(1060px,calc(100% - 32px));margin:auto}header{padding:22px 0 36px;background:#1d1930;color:#fff}.back{color:#dcd4ff;text-decoration:none;font-size:14px;font-weight:700}.eyebrow{margin-top:27px;color:#b9abff;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:7px 0 0;font-size:clamp(34px,5vw,52px);letter-spacing:-.045em}.intro{margin:12px 0 0;color:#d4d0e3;line-height:1.55}main{padding:30px 0 52px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.count{color:var(--muted)}button{border:1px solid var(--violet);border-radius:8px;padding:9px 13px;background:#fff;color:var(--violet);font:inherit;font-weight:750;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{display:flex;flex-direction:column;min-height:180px;padding:22px;border:1px solid #d5dce6;border-radius:16px;background:#edf0f4;color:#66758a}.item.allowed{background:#e8f7f1;border-color:#94d7c3;color:var(--ink);text-decoration:none;box-shadow:0 8px 24px rgba(29,67,70,.09)}.icon{display:grid;width:44px;height:44px;place-items:center;border-radius:13px;background:#d9e0e8;color:#526174;font-weight:900}.allowed .icon{background:#c9eee4;color:var(--teal)}.item h2{margin:20px 0 5px;font-size:22px}.details{font-size:14px}.status{margin-top:auto;padding-top:22px;color:#78869a;font-weight:800}.allowed .status{color:var(--teal)}.state{padding:24px;border:1px dashed #b6c1d1;border-radius:14px;background:#fff;color:var(--muted)}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><a class="back" href="index.html">&larr; Setup</a><div class="eyebrow">Direct item access</div><h1>Choose a Fabric item</h1><p class="intro" id="summary"></p></div></header><main class="wrap"><div class="toolbar"><div class="count" id="count">Checking direct item access...</div><button id="refresh">Refresh</button></div><div class="grid" id="items"></div></main><script>const list=document.getElementById('items'),count=document.getElementById('count'),key='fabricDirectAccessItems',p=new URLSearchParams(location.search),workspaceId=p.get('workspaceId'),targetId=p.get('targetId'),targetName=p.get('targetName'),targetType=p.get('targetType'),workspaceName=p.get('workspaceName');document.getElementById('summary').textContent=targetName?(targetType+': '+targetName+' · Direct permissions in '+workspaceName):'';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(body){const yes=body.items.filter(x=>x.hasDirectAccess),lh=yes.filter(x=>x.type==='Lakehouse').length,wh=yes.length-lh;count.textContent=body.availableItemCount+' available item(s): '+lh+' Lakehouse(s) and '+wh+' Warehouse(s) directly accessible to this identity.';list.innerHTML=body.items.map(x=>{const icon=x.type==='Lakehouse'?'LH':'WH';if(!x.hasDirectAccess)return '<article class="item"><div class="icon">'+icon+'</div><h2>'+esc(x.name)+'</h2><div class="details">'+esc(x.type)+' · No direct access</div><span class="status">Not available</span></article>';const q=new URLSearchParams({workspace:x.workspace,lakehouse:x.name,itemType:x.type,server:x.sqlEndpoint||'',database:x.name});return '<a class="item allowed" href="sql-simulator.html?'+q+'"><div class="icon">'+icon+'</div><h2>'+esc(x.name)+'</h2><div class="details">'+esc(x.type)+' · '+esc([...x.permissions,...x.additionalPermissions].join(', ')||'Direct access')+'</div><span class="status">Open access explorer &rarr;</span></a>'}).join('')}async function load(force){const c=JSON.parse(sessionStorage.getItem(key)||'null');if(!force&&c&&c.workspaceId===workspaceId&&c.targetId===targetId)return render(c.body);const q=new URLSearchParams({workspaceId,targetId,targetType,workspaceName,refresh:Date.now()}),r=await fetch('/api/fabric/effective-items?'+q),b=await r.json();if(!r.ok){count.textContent=b.error||'Access check failed';return}sessionStorage.setItem(key,JSON.stringify({workspaceId,targetId,body:b}));render(b)}document.getElementById('refresh').onclick=()=>load(true);load(false)</script></body></html>
